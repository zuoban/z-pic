name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify native target
        run: test "$(go env GOOS)/$(go env GOARCH)" = darwin/arm64
      - name: Verify formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet Go code
        run: go vet ./...
      - name: Vet native UI
        run: go tool mygo vet
      - name: Verify bundled WebP tool
        run: bash scripts/prepare-webptools.sh --verify
      - name: Verify bundled PNG tools
        run: bash scripts/prepare-pngtools.sh --verify
      - name: Build application
        run: go build ./...

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet and build native target
        run: |
          go vet ./...
          go build ./...
      - name: Run tests on Linux
        if: matrix.goos == 'linux'
        run: go test -race ./...
      - name: Run backend tests and compile UI tests on Windows
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          go test ./internal/...
          go test -c -o /dev/null .
      - name: Verify cross-architecture builds
        shell: bash
        run: |
          for target in darwin/amd64 linux/arm64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./...
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
          done
