name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify native target
        run: test "$(go env GOOS)/$(go env GOARCH)" = darwin/arm64
      - name: Verify formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet Go code
        run: go vet ./...
      - name: Vet native UI
        run: go tool mygo vet
      - name: Verify bundled WebP tool
        run: bash scripts/prepare-webptools.sh --verify
      - name: Build application
        run: go build ./...
